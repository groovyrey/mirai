name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.0'
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "No signing secrets set; release will be signed with debug keys."
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Pre-seed build dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # github.com release asset downloads currently return 504 from the
          # runner. Fetch the same files through the GitHub API and point the
          # Gradle wrapper at the local copy.
          mkdir -p .ci-artifacts
          gh release download v8.14.1 --repo gradle/gradle-distributions \
            --pattern gradle-8.14.1-all.zip --dir .ci-artifacts --clobber
          echo "d7042b3c11565c192041fc8c4703f541b888286404b4f267138c1d094d8ecdca  .ci-artifacts/gradle-8.14.1-all.zip" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path

          props = Path("android/gradle/wrapper/gradle-wrapper.properties")
          dist = f"file\\://{Path.cwd()}/.ci-artifacts/gradle-8.14.1-all.zip"
          lines = [
              f"distributionUrl={dist}" if line.startswith("distributionUrl=") else line
              for line in props.read_text().splitlines()
          ]
          if not any(line.startswith("distributionSha256Sum=") for line in lines):
              lines.append(
                  "distributionSha256Sum="
                  "d7042b3c11565c192041fc8c4703f541b888286404b4f267138c1d094d8ecdca"
              )
          props.write_text("\n".join(lines) + "\n")
          PY

          # media_kit downloads its native jars straight from GitHub releases.
          mkdir -p build/media_kit_libs_android_video/v1.1.7
          gh release download v1.1.7 --repo media-kit/libmpv-android-video-build \
            --pattern 'default-*.jar' --dir build/media_kit_libs_android_video/v1.1.7 --clobber

          # Gradle's Kotlin DSL compiler is a 56 MB Maven Central artifact that
          # the same outage redirects to the failing GitHub host.
          kotlin_dir=.ci-maven/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21
          mkdir -p "$kotlin_dir"
          gh release download v2.0.21 --repo JetBrains/kotlin \
            --pattern kotlin-compiler-embeddable-2.0.21.jar \
            --dir "$kotlin_dir" --clobber
          echo "79346ed53db48b18312a472602eb5c057070c54d  $kotlin_dir/kotlin-compiler-embeddable-2.0.21.jar" | sha1sum -c -
          if ! curl -fsSL --retry 3 --max-time 60 \
            -o "$kotlin_dir/kotlin-compiler-embeddable-2.0.21.pom" \
            'https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21/kotlin-compiler-embeddable-2.0.21.pom'; then
            curl -fsSL --retry 3 --max-time 60 \
              -o "$kotlin_dir/kotlin-compiler-embeddable-2.0.21.pom" \
              'https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21/kotlin-compiler-embeddable-2.0.21.pom'
          fi

          # Resolve the pre-seeded Kotlin jar before any network repository.
          sudo chmod a+w "$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts"
          python3 - <<'PY'
          import os
          from pathlib import Path

          repo = f'file://{Path.cwd()}/.ci-maven'
          local = f'        maven {{ url = java.net.URI("{repo}") }}'
          needle = "    repositories {\n        google()"
          replacement = f"    repositories {{\n{local}\n        google()"

          settings = Path(os.environ["FLUTTER_ROOT"]) / "packages/flutter_tools/gradle/settings.gradle.kts"
          text = settings.read_text()
          if repo not in text:
              text = text.replace(needle, replacement, 1)
          if "pluginManagement" not in text:
              text = (
                  "pluginManagement {\n"
                  "    repositories {\n"
                  f"{local}\n"
                  "        google()\n"
                  "        mavenCentral()\n"
                  "        gradlePluginPortal()\n"
                  "    }\n"
                  "}\n\n" + text
              )
          settings.write_text(text)

          main = Path("android/settings.gradle.kts")
          text = main.read_text()
          if repo not in text:
              main.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Build APK (release, arm64 only)
        run: flutter build apk --release --split-per-abi

      - name: Name APK with app title and version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          VERSION_CLEAN=${VERSION%+*}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "build/app/outputs/flutter-apk/Mirai-${VERSION_CLEAN}-arm64.apk"

      - name: Determine version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_clean=${VERSION%+*}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirai-apk
          path: build/app/outputs/flutter-apk/Mirai-*.apk

      - name: Upload APK to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Mirai ${{ steps.version.outputs.version }}"
          tag_name: ${{ steps.version.outputs.tag }}
          body: |
            arm64 APK only (`--split-per-abi`), release-signed so it installs
            over any previous Mirai build.
          files: build/app/outputs/flutter-apk/Mirai-${{ steps.version.outputs.version_clean }}-arm64.apk
          generate_release_notes: true

      - name: Prepare beta APK filename
        if: github.ref == 'refs/heads/main'
        run: |
          cp build/app/outputs/flutter-apk/Mirai-${{ steps.version.outputs.version_clean }}-arm64.apk \
             build/app/outputs/flutter-apk/Mirai-${{ steps.version.outputs.version_clean }}-beta.apk

      - name: Publish rolling beta pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: "Mirai Beta"
          tag_name: beta
          body: |
            Rolling test build from `main`. Release-signed with the real
            keystore, so it installs over any previous Mirai build.

            arm64 APK only (`--split-per-abi`).

            This is a pre-release for testing before the version is cut to a
            real release. The stable app never announces it — only install it
            when you intend to test the newest changes.
          files: build/app/outputs/flutter-apk/Mirai-${{ steps.version.outputs.version_clean }}-beta.apk
          prerelease: true