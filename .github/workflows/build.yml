name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.0'
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "No signing secrets set; release will be signed with debug keys."
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Name APK with app title and version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          VERSION_CLEAN=${VERSION%+*}
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/Mirai-${VERSION_CLEAN}.apk"

      - name: Determine version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_clean=${VERSION%+*}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirai-apk
          path: build/app/outputs/flutter-apk/Mirai-*.apk

      - name: Upload APK to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Mirai ${{ steps.version.outputs.version }}"
          tag_name: ${{ steps.version.outputs.tag }}
          files: build/app/outputs/flutter-apk/Mirai-${{ steps.version.outputs.version_clean }}.apk
          generate_release_notes: true

      - name: Prepare beta APK filename
        if: github.ref == 'refs/heads/main'
        run: |
          cp build/app/outputs/flutter-apk/Mirai-${{ steps.version.outputs.version_clean }}.apk \
             build/app/outputs/flutter-apk/Mirai-${{ steps.version.outputs.version_clean }}-beta.apk

      - name: Publish rolling beta pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: "Mirai Beta"
          tag_name: beta
          body: |
            Rolling test build from `main`. Release-signed with the real
            keystore, so it installs over any previous Mirai build.

            This is a pre-release for testing before the version is cut to a
            real release. The stable app never announces it — only install it
            when you intend to test the newest changes.
          files: build/app/outputs/flutter-apk/Mirai-${{ steps.version.outputs.version_clean }}-beta.apk
          prerelease: true